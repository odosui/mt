<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{metaDesc}}
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto+Slab:wght@400;500;700&family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <button
      class="hamburger"
      onclick="document.querySelector('.sidebar').classList.toggle('open')"
      aria-label="Menu"
    >
      &#9776;
    </button>
    <nav class="sidebar">
      <strong><a href="/" class="home-link">Home</a></strong>
      {{sidebar}}
    </nav>
    <main class="main-content">{{content}}</main>
  </body>
</html>
